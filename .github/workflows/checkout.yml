name: Checkout

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"
  pull_request:
    branches:
      - "main"
      - "master"
      - "dev"
      - "develop"
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "support/**"
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/**.yaml"
      - ".github/**.yml"
      - "bin/**.dart"
      - "lib/**.dart"
      - "test/**.dart"
      - "example/**.dart"
      # The smoke test renders config.yaml with the bundled fonts.
      - "config.yaml"
      - "fonts/**"

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  checkout:
    name: "🧪 Check code with analysis, format, and tests"
    runs-on: ubuntu-latest
    env:
      threshold: 90
    defaults:
      run:
        working-directory: ./
    timeout-minutes: 10
    steps:
      - name: 📦 Get the .github actions
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github

      - name: 🚂 Setup Dart and dependencies
        uses: ./.github/actions/setup
        with:
          dart-version: stable

      - name: 👷 Install Dependencies
        timeout-minutes: 1
        run: |
          dart pub get

      - name: 🚦 Check code format
        id: check-format
        timeout-minutes: 1
        run: dart format --set-exit-if-changed --line-length 120 --output none bin lib test

      - name: 📈 Check analyzer
        id: check-analyzer
        timeout-minutes: 1
        run: dart analyze --fatal-infos --fatal-warnings bin/ lib/ test/

      - name: 👀 Verify versions
        id: verify-versions
        timeout-minutes: 1
        run: |
          test -f pubspec.yaml && test -f CHANGELOG.md
          version_pubspec=$(grep '^version:' pubspec.yaml | awk '{print $2}' | sed 's/[^[:print:]]//g')
          test -n "$version_pubspec"
          echo "Version from pubspec.yaml: '$version_pubspec'"
          echo "$version_pubspec" > /tmp/version_pubspec
          grep -q "# $version_pubspec" CHANGELOG.md || (echo "Version not found in CHANGELOG.md" >&2; exit 1)

      - name: 🧪 Run tests
        id: run-tests
        timeout-minutes: 5
        run: |
          mkdir -p reports
          dart test --platform=vm --reporter=github \
            --file-reporter=json:reports/tests.json \
            --timeout=5m --concurrency=12 --color

      - name: 🖨️ Verify the CLI renders the sample invoice
        id: smoke-test
        timeout-minutes: 2
        run: |
          dart run bin/main.dart --input=config.yaml --output=/tmp/invoice.pdf --locale=en_US
          test -s /tmp/invoice.pdf
          head -c 5 /tmp/invoice.pdf | grep -q '%PDF-'
          echo "Rendered $(stat -c%s /tmp/invoice.pdf) bytes"

      - name: 📥 Upload test report
        if: (success() || failure()) && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/tests.json
          if-no-files-found: ignore

